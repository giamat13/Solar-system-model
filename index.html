<style>
body {
  margin: 0;
  background-color: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: auto;
  position: relative;
  color: white;

}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 10px;
  right: 0;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 10px;
  border-radius: 8px 0 0 8px;
  z-index: 50;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateX(0);
  transition: transform 0.4s ease;
}
.sidebar.hidden {
  transform: translateX(110%);
}

.sidebar label { display: block; margin-bottom: 5px; }

.sun {
  width: 10vw; height: 10vw; max-width: 120px; max-height: 120px;
  background: radial-gradient(circle, yellow 40%, orange 80%);
  border-radius: 50%; position: absolute; z-index: 10;
}

  position: absolute;
  border: 1px dashed rgba(255,255,255,0.2);
  border-radius: 50%;
}
.planet {
  position: absolute; border-radius: 50%;
  background-size: cover; background-position: center;
}

.mars { width:0.795vw; height:0.795vw; top:-0.3975vw; left:calc(50% - 0.3975vw); background-image:url('https://solarsystem.nasa.gov/system/feature_items/images/19_mars.png'); }
.jupiter { width:5.955vw; height:5.955vw; top:-2.9775vw; left:calc(50% - 2.9775vw); background-image:url('https://solarsystem.nasa.gov/system/feature_items/images/16_jupiter_new.png'); }
.saturn { width:5.25vw; height:5.25vw; top:-2.625vw; left:calc(50% - 2.625vw); background-image:url('https://solarsystem.nasa.gov/system/feature_items/images/28_saturn.png'); }
.uranus { width:3vw; height:3vw; top:-1.5vw; left:calc(50% - 1.5vw); background-image:url('https://solarsystem.nasa.gov/system/feature_items/images/29_uranus.png'); }
.neptune { width:2.94vw; height:2.94vw; top:-1.47vw; left:calc(50% - 1.47vw); background-image:url('https://solarsystem.nasa.gov/system/feature_items/images/30_neptune.png'); }

  width:0.5vw; height:0.5vw;

  background-size:cover; background-position:center;
  border-radius:50%; position:absolute; z-index:20;

/* Toggle sidebar button */

  .uranus-orbit { width: 44vw; height: 44vw; }

<script>
// --- Elements ---
const earth = document.querySelector('.earth');
const moon = document.getElementById('moon');
const realTimeCheckbox = document.getElementById('realTime');
const moonCheckbox = document.getElementById('toggle-moon');
const speedSlider = document.getElementById('speedSlider');
const datetimePicker = document.getElementById('datetimePicker');
const currentTimeDisplay = document.getElementById('currentTime');
const eclipseBanner = document.getElementById('eclipseBanner');
const eclipseInfo = document.getElementById('eclipseInfo');
const latInput = document.getElementById('latInput');
const lonInput = document.getElementById('lonInput');
const getLocationBtn = document.getElementById('getLocationBtn');
const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
const sidebar = document.getElementById('sidebar');

let simulatedDate = new Date(datetimePicker.value || new Date());
window.__solarDate = simulatedDate;

// speed mapping
function sliderToSpeed(value) {
  const min = 365 / 3600;
  const max = 36.5;
  return min + (max - min) * (value / 1000);
}
let speedMultiplier = sliderToSpeed(speedSlider.value);

// orbits data
const orbits = [
  {el: document.querySelector('.mercury-orbit'), baseDuration: 88, planet: 'mercury'},
  {el: document.querySelector('.venus-orbit'), baseDuration: 225, planet: 'venus'},
  {el: document.querySelector('.earth-orbit'), baseDuration: 365.25, planet: 'earth'},
  {el: document.querySelector('.mars-orbit'), baseDuration: 687, planet: 'mars'},
  {el: document.querySelector('.jupiter-orbit'), baseDuration: 4331, planet: 'jupiter'},
  {el: document.querySelector('.saturn-orbit'), baseDuration: 10747, planet: 'saturn'},
  {el: document.querySelector('.uranus-orbit'), baseDuration: 30589, planet: 'uranus'},
  {el: document.querySelector('.neptune-orbit'), baseDuration: 59800, planet: 'neptune'},
];

// update planet rotation
function updatePlanetPositionsFromDate() {
  const daysSinceEpoch = simulatedDate.getTime() / (1000*60*60*24);
  orbits.forEach(orbit => {
    const angle = (daysSinceEpoch % orbit.baseDuration) / orbit.baseDuration * 360;
    orbit.el.style.transform = `rotate(${angle}deg)`;
  });
}

// moon visibility
function updateMoonVisibility() {
  const earthVisible = window.getComputedStyle(earth).display !== 'none';
  moonCheckbox.disabled = !earthVisible;
  moon.style.display = earthVisible && moonCheckbox.checked ? 'block' : 'none';
}

// moon position
function updateMoonPosition() {
  if (earth.style.display === 'none' || moon.style.display === 'none') return;
  const daysSinceEpoch = simulatedDate.getTime() / (1000*60*60*24);
  const moonAngle = (daysSinceEpoch % 27.3) / 27.3 * 2 * Math.PI;
  const earthRect = earth.getBoundingClientRect();
  const earthCenter = {x: earthRect.left + earthRect.width/2, y: earthRect.top + earthRect.height/2};
  const radius = Math.max(20, earthRect.width + 5);
  moon.style.left = earthCenter.x + radius * Math.cos(moonAngle) - moon.offsetWidth/2 + 'px';
  moon.style.top = earthCenter.y + radius * Math.sin(moonAngle) - moon.offsetHeight/2 + 'px';
}

// angular separation
function angularSeparationDeg(sunPos, moonPos) {
  function toVector(p) {
    const az = p.azimuth;
    const alt = p.altitude;
    const x = Math.cos(alt) * Math.cos(az);
    const y = Math.cos(alt) * Math.sin(az);
    const z = Math.sin(alt);
    return {x,y,z};
  }
  const s = toVector(sunPos);
  const m = toVector(moonPos);
  const dot = s.x*m.x + s.y*m.y + s.z*m.z;
  const clamped = Math.max(-1, Math.min(1, dot));
  const angleRad = Math.acos(clamped);
  return angleRad * 180 / Math.PI;
}

// check eclipse
function checkForEclipse(date, lat, lon) {
  const sunPos = SunCalc.getPosition(date, lat, lon);
  const moonPos = SunCalc.getMoonPosition(date, lat, lon);
  const moonIll = SunCalc.getMoonIllumination(date);

  const separation = angularSeparationDeg(sunPos, moonPos);
  const isNewMoon = moonIll.fraction < 0.12;
  const isSolar = separation < 0.6 && isNewMoon;
  const isFullMoon = moonIll.fraction > 0.88;
  const isLunar = Math.abs(180 - separation) < 0.9 && isFullMoon;

  return {isSolar, isLunar, separation, moonFraction: moonIll.fraction};
}

// simulated time
function updateSimulatedTime() {
  if (realTimeCheckbox.checked) simulatedDate = new Date(simulatedDate.getTime() + 1000);
  else simulatedDate = new Date(simulatedDate.getTime() + 1000 * 60 * 60 * 24 * speedMultiplier);
  currentTimeDisplay.textContent = simulatedDate.toLocaleString();
  window.__solarDate = simulatedDate;
}

// eclipse banner
function showEclipseBanner(type, details) {
  if (!type) {
    eclipseBanner.style.display = 'none';
    eclipseBanner.className = '';
    eclipseInfo.textContent = '';
    return;
  }
  eclipseBanner.style.display = 'block';
  if (type === 'solar') {
    eclipseBanner.className = 'solar';
    eclipseBanner.textContent = 'ליקוי חמה';
    eclipseInfo.textContent = `זיהוי גיאומטרי: הפרש זוויתי ${details.separation.toFixed(2)}° — הירח חדש (${(details.moonFraction*100).toFixed(0)}%).`;
  } else if (type === 'lunar') {
    eclipseBanner.className = 'lunar';
    eclipseBanner.textContent = 'ליקוי ירח';
    eclipseInfo.textContent = `זיהוי גיאומטרי: הפרש זוויתי ≈ ${details.separation.toFixed(2)}° — ירח מלא (${(details.moonFraction*100).toFixed(0)}%).`;
  }
}

// main animate loop
function animate() {
  updateSimulatedTime();
  updatePlanetPositionsFromDate();
  updateMoonPosition();
  updateMoonVisibility();

  const lat = parseFloat(latInput.value) || 31.7683;
  const lon = parseFloat(lonInput.value) || 35.2137;
  const eclipse = checkForEclipse(simulatedDate, lat, lon);

  if (eclipse.isSolar) showEclipseBanner('solar', eclipse);
  else if (eclipse.isLunar) showEclipseBanner('lunar', eclipse);
  else showEclipseBanner(null, null);

  requestAnimationFrame(animate);
}
animate();

// --- listeners ---
datetimePicker.addEventListener('change', () => {
  simulatedDate = new Date(datetimePicker.value);
  window.__solarDate = simulatedDate;
});
speedSlider.addEventListener('input', () => speedMultiplier = sliderToSpeed(speedSlider.value));
moonCheckbox.addEventListener('change', updateMoonVisibility);

document.querySelectorAll('.toggle-planet').forEach(cb => {
  cb.addEventListener('change', e => {
    const planetName = e.target.dataset.planet;
    const planetEl = document.querySelector(`.${planetName}`);
    const orbitEl = document.querySelector(`.${planetName}-orbit`);
    planetEl.style.display = e.target.checked ? 'block' : 'none';
    orbitEl.style.display = e.target.checked ? 'block' : 'none';
    updateMoonVisibility();
  });
});

toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('hidden'));

const toggle3DBtn = document.getElementById('toggle3DBtn');
toggle3DBtn.addEventListener('click', async () => {
  const active = document.body.classList.toggle('mode-3d');
  toggle3DBtn.textContent = active ? 'מצב דו מימד' : 'מצב תלת מימד';
  if (active && window.initSolarSystem3D) {
    await window.initSolarSystem3D();
  }
});

getLocationBtn.addEventListener('click', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      latInput.value = pos.coords.latitude.toFixed(4);
      lonInput.value = pos.coords.longitude.toFixed(4);
    });
  } else alert('הדפדפן שלך לא תומך בגאולוקציה.');
});

// initialize map
const map = L.map('map').setView([latInput.value, lonInput.value], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
latInput.addEventListener('change', () => map.setView([latInput.value, lonInput.value], 4));
lonInput.addEventListener('change', () => map.setView([latInput.value, lonInput.value], 4));
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { Fn, float, color, uniform, texture, uv, time, mix, pow, normalize, cameraPosition, positionWorld, normalWorld, oscSine } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Solar System Scope texture set (CC BY 4.0), mirrored on Wikimedia Commons.
// The NASA image URLs used by the 2D CSS view don't allow cross-origin reads,
// so they can't be used as GPU textures here - Wikimedia serves ACAO: * instead.
const PLANETS_3D = [
  { name: 'mercury', orbitRadius: 6,  size: 0.38, baseDuration: 88,     texture: 'https://upload.wikimedia.org/wikipedia/commons/9/92/Solarsystemscope_texture_2k_mercury.jpg' },
  { name: 'venus',   orbitRadius: 8,  size: 0.6,  baseDuration: 225,    texture: 'https://upload.wikimedia.org/wikipedia/commons/4/40/Solarsystemscope_texture_2k_venus_surface.jpg' },
  { name: 'earth',   orbitRadius: 10, size: 0.65, baseDuration: 365.25, texture: 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Solarsystemscope_texture_2k_earth_daymap.jpg' },
  { name: 'mars',    orbitRadius: 13, size: 0.5,  baseDuration: 687,    texture: 'https://upload.wikimedia.org/wikipedia/commons/4/46/Solarsystemscope_texture_2k_mars.jpg' },
  { name: 'jupiter', orbitRadius: 19, size: 1.8,  baseDuration: 4331,   texture: 'https://upload.wikimedia.org/wikipedia/commons/b/be/Solarsystemscope_texture_2k_jupiter.jpg' },
  { name: 'saturn',  orbitRadius: 25, size: 1.6,  baseDuration: 10747,  texture: 'https://upload.wikimedia.org/wikipedia/commons/e/ea/Solarsystemscope_texture_2k_saturn.jpg' },
  { name: 'uranus',  orbitRadius: 30, size: 1.1,  baseDuration: 30589,  texture: 'https://upload.wikimedia.org/wikipedia/commons/9/95/Solarsystemscope_texture_2k_uranus.jpg' },
  { name: 'neptune', orbitRadius: 35, size: 1.05, baseDuration: 59800,  texture: 'https://upload.wikimedia.org/wikipedia/commons/1/1e/Solarsystemscope_texture_2k_neptune.jpg' },
];
const SUN_TEXTURE = 'https://upload.wikimedia.org/wikipedia/commons/c/cb/Solarsystemscope_texture_2k_sun.jpg';
const SATURN_RING_TEXTURE = 'https://upload.wikimedia.org/wikipedia/commons/7/7d/Solarsystemscope_texture_2k_saturn_ring_alpha.png';
const MOON_TEXTURE = 'https://upload.wikimedia.org/wikipedia/commons/b/b3/Full_moon.jpeg';
const MOON_ORBIT_RADIUS = 1.1;
const MOON_SIZE = 0.18;
const MOON_PERIOD_DAYS = 27.3;
const SUN_RADIUS = 3;

let ready = false;
let camera, scene, renderer, controls;
const planetMeshes = {}; // name -> { mesh, data }
let moonMesh;

function orbitAngle(daysSinceEpoch, periodDays) {
  return ((daysSinceEpoch % periodDays) / periodDays) * Math.PI * 2;
}

function makeOrbitLine(radius) {
  const points = [];
  const segments = 128;
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicNodeMaterial({ color: 0x555577, transparent: true, opacity: 0.5 });
  return new THREE.Line(geometry, material);
}

function createSun() {
  const tex = new THREE.TextureLoader().load(SUN_TEXTURE);
  tex.colorSpace = THREE.SRGBColorSpace;

  const geometry = new THREE.SphereGeometry(SUN_RADIUS, 48, 48);
  const material = new THREE.MeshBasicNodeMaterial();
  // Real sun texture with a gentle pulsing glow via TSL instead of a static color.
  material.colorNode = texture(tex, uv()).mul(oscSine(time.mul(0.3)).mul(0.15).add(0.9));
  const sun = new THREE.Mesh(geometry, material);

  const sunLight = new THREE.PointLight(0xffffff, 3, 0, 0);
  sun.add(sunLight);
  return sun;
}

function createPlanet(data) {
  const tex = new THREE.TextureLoader().load(data.texture);
  tex.colorSpace = THREE.SRGBColorSpace;

  const geometry = new THREE.SphereGeometry(data.size, 32, 32);
  const material = new THREE.MeshStandardNodeMaterial();
  material.colorNode = texture(tex, uv());
  material.roughnessNode = float(0.8);
  material.metalnessNode = float(0.0);

  if (data.name === 'earth') {
    // Thin atmospheric rim, same fresnel idea as the skill's earth-shader example.
    material.emissiveNode = Fn(() => {
      const viewDir = normalize(cameraPosition.sub(positionWorld));
      const fresnel = pow(float(1.0).sub(normalWorld.dot(viewDir).saturate()), 3.0);
      return color(0x4db2ff).mul(fresnel).mul(0.5);
    })();
  }

  const mesh = new THREE.Mesh(geometry, material);
  const pivot = new THREE.Group();
  pivot.add(mesh);
  return { mesh, pivot };
}

function createSaturnRing(data) {
  const tex = new THREE.TextureLoader().load(SATURN_RING_TEXTURE);
  tex.colorSpace = THREE.SRGBColorSpace;

  const geometry = new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64);
  // Ring texture is a 1D radial strip; map it across the ring's radius, not around it.
  const pos = geometry.attributes.position;
  const v3 = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);
    const radialT = (v3.length() - data.size * 1.4) / (data.size * 0.8);
    geometry.attributes.uv.setXY(i, radialT, 1);
  }
  const material = new THREE.MeshBasicNodeMaterial({ transparent: true, side: THREE.DoubleSide });
  material.colorNode = texture(tex, uv());
  material.opacityNode = texture(tex, uv()).a;
  const ring = new THREE.Mesh(geometry, material);
  ring.rotation.x = Math.PI / 2.4;
  return ring;
}

function createStarfield() {
  const count = 2000;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const radius = 150 + Math.random() * 150;
    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsNodeMaterial({ color: 0xffffff, size: 1 });
  return new THREE.Points(geometry, material);
}

async function initSolarSystem3D() {
  if (ready) return;
  ready = true;

  const container = document.getElementById('threeContainer');

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 30, 55);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000005);
  scene.add(createStarfield());
  scene.add(new THREE.AmbientLight(0x222222));
  scene.add(createSun());

  PLANETS_3D.forEach(data => {
    const { mesh, pivot } = createPlanet(data);
    scene.add(makeOrbitLine(data.orbitRadius));
    scene.add(pivot);
    mesh.position.x = data.orbitRadius;
    planetMeshes[data.name] = { mesh, pivot, data };

    if (data.name === 'saturn') {
      mesh.add(createSaturnRing(data));
    }
    if (data.name === 'earth') {
      const moonTex = new THREE.TextureLoader().load(MOON_TEXTURE);
      const moonGeometry = new THREE.SphereGeometry(MOON_SIZE, 16, 16);
      const moonMaterial = new THREE.MeshStandardNodeMaterial();
      moonMaterial.colorNode = texture(moonTex, uv());
      moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
      moonMesh.position.x = MOON_ORBIT_RADIUS;
      const moonPivot = new THREE.Group();
      moonPivot.add(moonMesh);
      mesh.add(moonPivot);
      moonMesh.userData.pivot = moonPivot;
    }
  });

  renderer = new THREE.WebGPURenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);
  await renderer.init();

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 8;
  controls.maxDistance = 300;

  window.addEventListener('resize', onResize3D);
  syncVisibilityFromCheckboxes();
  document.querySelectorAll('.toggle-planet').forEach(cb => cb.addEventListener('change', syncVisibilityFromCheckboxes));
  document.getElementById('toggle-moon').addEventListener('change', syncVisibilityFromCheckboxes);

  renderer.setAnimationLoop(animate3D);
}

function syncVisibilityFromCheckboxes() {
  document.querySelectorAll('.toggle-planet').forEach(cb => {
    const entry = planetMeshes[cb.dataset.planet];
    if (entry) entry.pivot.visible = cb.checked;
  });
  if (moonMesh) {
    const earthChecked = document.querySelector('[data-planet="earth"]').checked;
    moonMesh.visible = earthChecked && document.getElementById('toggle-moon').checked;
  }
}

function onResize3D() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate3D() {
  const date = window.__solarDate || new Date();
  const daysSinceEpoch = date.getTime() / (1000 * 60 * 60 * 24);

  Object.values(planetMeshes).forEach(({ pivot, mesh, data }) => {
    pivot.rotation.y = orbitAngle(daysSinceEpoch, data.baseDuration);
    mesh.rotation.y += 0.01;
  });
  if (moonMesh) {
    moonMesh.userData.pivot.rotation.y = orbitAngle(daysSinceEpoch, MOON_PERIOD_DAYS);
  }

  controls.update();
  renderer.render(scene, camera);
}

window.initSolarSystem3D = initSolarSystem3D;
</script>
</body>
</html>
